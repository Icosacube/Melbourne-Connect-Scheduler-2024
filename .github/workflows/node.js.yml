# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mcs_backend
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
    - name: Install dependencies
      run: npm ci
    - name: Create .env file
      run: |
        echo "${{ secrets.BACKEND_ENV }}" > .env
    - name: Run backend unit tests
      run: npm run test -- src/tests

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: ./frontend/mcs-frontend
        run: npm install

      - name: Run frontend tests
        working-directory: ./frontend/mcs-frontend
        run: npm run test -- src/__tests__/unitTests

  integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: ./frontend/mcs-frontend
        run: npm install

      - name: Run frontend tests
        working-directory: ./frontend/mcs-frontend
        run: npm run test -- src/__tests__/integrationTests

  merge-to-staging:
    needs: [backend-tests, frontend-tests, integration-test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

      - name: Merge main into Staging-Server
        run: |
          git checkout Staging-Server
          git merge origin/main
          git push origin Staging-Server

