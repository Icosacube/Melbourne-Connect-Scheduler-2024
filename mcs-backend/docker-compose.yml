version: "3.8"

services:
  postgres:
    image: postgres:alpine
    container_name: authdb

    restart: always

    env_file: ./.env
    environment:
      - POSTGRES_USER=$POSTGRES_USERNAME
      - POSTGRES_PASSWORD=$POSTGRES_PASSWORD
      - POSTGRES_DB=$POSTGRES_DB_NAME

    ports:
      - $POSTGRES_LOCAL_PORT:$POSTGRES_DOCKER_PORT

    volumes:
      - ./postgres_authdb:/var/lib/postgresql/data

  backend:
    depends_on:
      - postgres

    # image:
    build: .
    container_name: mcs_backend

    restart: always

    env_file: ./.env
    environment:
      db-url: jdbc:postgresql://postgres:$POSTGRES_LOCAL_PORT/$POSTGRES_DB_NAME
      db-username: $POSTGRES_USERNAME
      db-password: $POSTGRES_PASSWORD

    ports:
      - $SPRING_LOCAL_PORT:$SPRING_DOCKER_PORT

    volumes:
      - .:/mcs-app

    stdin_open: true
    tty: true
